name: Deploy CW Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cw-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://araucariadx.com/cw/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static web app
        run: pnpm build

      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Inspect FTPS certificate
        run: |
          handshake_file="$RUNNER_TEMP/ftps-handshake.pem"
          set +e
          timeout 20 openssl s_client             -connect ftp.araucariadx.com:21             -starttls ftp             -servername ftp.araucariadx.com             -showcerts             </dev/null > "$handshake_file" 2>/dev/null
          set -e

          if ! openssl x509 -in "$handshake_file"             -noout -subject -issuer -ext subjectAltName; then
            echo "::error title=Certificado indisponível::Não foi possível ler o certificado público do endpoint FTPS."
            exit 1
          fi

      - name: Upload the /cw site
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          for key in FTP_SERVER FTP_USERNAME LFTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!key}" ]; then
              echo "::error title=Secret ausente::Cadastre o Secret $key antes do deploy."
              exit 1
            fi
          done

          if [[ ! "$FTP_SERVER" =~ ^[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then
            echo "::error title=FTP_SERVER inválido::Use somente o host e a porta, por exemplo ftp.araucariadx.com:21."
            exit 1
          fi

          if [[ ! "$FTP_SERVER_DIR" =~ ^/?[A-Za-z0-9._/-]+/?$ ]]; then
            echo "::error title=FTP_SERVER_DIR inválido::Use somente o caminho, por exemplo public_html/cw/."
            exit 1
          fi

          command_file="$RUNNER_TEMP/deploy.lftp"
          cat > "$command_file" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ssl:verify-certificate true
          open --user "$FTP_USERNAME" --env-password "$FTP_SERVER"
          mirror --reverse --verbose apps/web/dist "$FTP_SERVER_DIR"
          bye
          EOF

          chmod 600 "$command_file"
          lftp -f "$command_file"
          rm -f "$command_file"
