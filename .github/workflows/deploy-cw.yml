name: Deploy CW Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cw-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://araucariadx.com/cw/

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static web app
        run: pnpm build

      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Upload the /cw site
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!key}" ]; then
              echo "::error title=Secret ausente::Cadastre o Secret $key antes do deploy."
              exit 1
            fi
          done

          command_file="$RUNNER_TEMP/deploy.lftp"
          cat > "$command_file" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ssl:verify-certificate true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mirror --reverse --verbose apps/web/dist "$FTP_SERVER_DIR"
          bye
          EOF

          chmod 600 "$command_file"
          lftp -f "$command_file"
          rm -f "$command_file"
